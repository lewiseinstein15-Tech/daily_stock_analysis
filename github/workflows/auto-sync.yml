name: 🔄 Auto Sync Fork

on:
  schedule:
    # Sync every day at 6:00 AM UTC
    - cron: '0 6 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Sync with upstream
        run: |
          git remote add upstream https://github.com/ZhuLinsen/daily_stock_analysis.git
          git fetch upstream
          git merge upstream/main --allow-unrelated-histories --no-edit || echo "Merge conflicts detected, skipping sync"
          git push origin main || echo "Push failed, manual sync needed"
