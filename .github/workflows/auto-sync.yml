name: 🔄 Auto Sync Fork

on:
  schedule:
    # Sync every day at 6:00 AM UTC
    - cron: '0 6 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Sync with upstream
        id: sync
        run: |
          git remote add upstream https://github.com/ZhuLinsen/daily_stock_analysis.git
          git fetch upstream
          
          # Check if we need to sync
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)
          
          if [ "$LOCAL" != "$UPSTREAM" ]; then
            echo "needs_sync=true" >> $GITHUB_OUTPUT
            git merge upstream/main --allow-unrelated-histories --no-edit || echo "Merge conflicts"
            git push origin main || echo "Push failed"
          else
            echo "needs_sync=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Notify if synced
        if: steps.sync.outputs.needs_sync == 'true'
        run: |
          curl -d "title=✅ Repo Auto-Synced&message=Successfully synced with upstream repository\n\nYour trading bot files are safe!" ${{ secrets.NTFY_URL }}
      
      - name: Notify if already synced
        if: steps.sync.outputs.needs_sync == 'false'
        run: |
          curl -d "title=✅ Repo Up to Date&message=No sync needed - already current" ${{ secrets.NTFY_URL }}
