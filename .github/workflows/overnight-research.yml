# 🌙 Overnight Agent Research — learning + morning plan, NEVER trades.
#
# This used to run the legacy Alpaca-only bot in research mode, which
# failed the moment GitHub secrets were removed (keys now live in the
# user's Jexi account). It now runs the broker-agnostic runner:
#
#   1. self-eval  — closes stale practice trades, updates agent weights
#                   from real outcomes (the memory keeps learning),
#   2. plan       — reads the real broker account (whatever broker the
#                   user saved in the app) and builds tomorrow's plan,
#   3. pushes a short plain-English summary into the Jexi app feed.
#
# No order can be submitted here: neither command trades.

name: 🌙 Overnight Agent Research

on:
  schedule:
    - cron: '0 */4 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: overnight-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JEXI_APP_SERVER: ${{ vars.JEXI_APP_SERVER || 'https://jexi-server.vercel.app' }}
      JEXI_AGENT_SECRET: ${{ secrets.JEXI_AGENT_SECRET }}
      JEXI_APP_EMAIL: ${{ secrets.JEXI_APP_EMAIL }}
      JEXI_PLAIN_ENGLISH: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Overnight research (learning + plan, never trades)
        run: |
          set -euo pipefail
          echo "--- self-eval (close stale practice trades, update agent weights)"
          python -m jexi_market self-eval
          echo "--- overnight plan (real account, research only)"
          python -m jexi_market plan --json > /tmp/plan.json
          python - <<'PY'
          import json

          from jexi_market.config import get_config
          from jexi_market.app_account import push_notification

          try:
              plan = json.load(open("/tmp/plan.json"))
          except Exception:
              plan = {}

          def money(v):
              try:
                  return f"${float(v):,.2f}"
              except (TypeError, ValueError):
                  return "n/a"

          lines = [
              "Overnight research done — no trades placed.",
          ]
          if plan.get("equity"):
              lines.append(
                  f"Account: {plan.get('broker_name') or 'broker'} · equity {money(plan.get('equity'))} · "
                  f"cash {money(plan.get('cash'))} · {plan.get('n_positions', 0)} open positions."
              )
              lines.append(
                  f"Room for new positions: {plan.get('max_new_positions', 'n/a')} · "
                  f"risk per trade: {money(plan.get('risk_per_trade_amount'))}."
              )
          else:
              # Broker unreachable (e.g. an expired Pocket Option SSID):
              # never show "$0.00" — that would look like money vanished.
              lines.append(
                  f"Account: could not reach {plan.get('broker_name') or 'your broker'} right now — "
                  "your money and positions are safe. See the note below."
              )
          watch_out = plan.get("watch_out") or []
          if isinstance(watch_out, list) and watch_out:
              items = [str(w).rstrip(".") for w in watch_out[:3]]
              lines.append("Watch out: " + "; ".join(items) + ".")
          notes = plan.get("notes") or []
          if isinstance(notes, list) and notes:
              lines.append("Notes: " + " ".join(str(n) for n in notes[:2]))

          push_notification(get_config(), "\n".join(lines), kind="plan", title="🌙 Overnight research")
          print("overnight summary delivered to the Jexi app")
          PY

      - name: Notify Jexi app if failed
        if: failure()
        env:
          JEXI_APP_SERVER: ${{ vars.JEXI_APP_SERVER || 'https://jexi-server.vercel.app' }}
          JEXI_AGENT_SECRET: ${{ secrets.JEXI_AGENT_SECRET }}
          JEXI_APP_EMAIL: ${{ secrets.JEXI_APP_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${JEXI_AGENT_SECRET:-}" ] || [ -z "${JEXI_APP_EMAIL:-}" ]; then
            echo "Jexi app not configured (set JEXI_AGENT_SECRET / JEXI_APP_EMAIL secrets)."
            exit 0
          fi
          curl --fail -sS -X POST "${JEXI_APP_SERVER%/}/api/agent/notify" \
            -H "x-agent-secret: ${JEXI_AGENT_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${JEXI_APP_EMAIL}\",\"kind\":\"warn\",\"title\":\"Overnight research failed\",\"message\":\"The overnight research run did not finish. Nothing was traded - your money and positions are safe.\"}" \
            && echo "failure notice delivered to the Jexi app"
