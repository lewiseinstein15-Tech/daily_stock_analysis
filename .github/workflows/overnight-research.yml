name: 🌙 Overnight Agent Research

on:
  schedule:
    # Research runs outside the trading window too, but is hard-wired to
    # research-only + dry-run: it can never submit an order.
    - cron: '0 */4 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deterministic research dependencies
        env:
          BOT_USE_LLM_AGENTS: ${{ vars.BOT_USE_LLM_AGENTS || 'false' }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests pytz pandas numpy python-dotenv pydantic tenacity fake_useragent
          # The repository multi-agent council is opt-in.  Do not add an LLM
          # package or incur provider cost on a normal overnight run.
          if [ "${BOT_USE_LLM_AGENTS:-false}" = "true" ]; then
            pip install litellm json-repair tiktoken openai jinja2 markdown2
          fi

      - name: Run paper research council (never trades)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          APCA_API_BASE_URL: ${{ vars.APCA_API_BASE_URL || 'https://paper-api.alpaca.markets' }}
          ALPACA_DATA_BASE_URL: ${{ vars.ALPACA_DATA_BASE_URL || 'https://data.alpaca.markets' }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'my-stock-report-kenya' }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          STOCKS_TO_TRADE: ${{ vars.STOCKS_TO_TRADE || 'AAPL,MSFT,NVDA' }}
          BOT_RESEARCH_ONLY: 'true'
          BOT_DRY_RUN: 'true'
          BOT_FORCE_RUN: 'true'
          BOT_PAPER_ONLY: 'true'
          BOT_USE_LLM_AGENTS: ${{ vars.BOT_USE_LLM_AGENTS || 'false' }}
          BOT_LLM_AGENTS_REQUIRED: ${{ vars.BOT_LLM_AGENTS_REQUIRED || 'false' }}
          BOT_LLM_AGENT_WEIGHT: ${{ vars.BOT_LLM_AGENT_WEIGHT || '0.35' }}
          AGENT_ARCH: ${{ vars.AGENT_ARCH || 'multi' }}
          AGENT_ORCHESTRATOR_MODE: ${{ vars.AGENT_ORCHESTRATOR_MODE || 'standard' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL }}
        run: python automated_trading_bot.py

      - name: Notify if research failed
        if: failure()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${NTFY_URL:-}" ]; then
            echo "NTFY_URL secret not set — skipping failure notification."
            exit 0
          fi
          TOPIC="${NTFY_URL##*/}"
          SERVER="${NTFY_URL%/*}"
          AUTH_ARGS=()
          if [ -n "${NTFY_TOKEN:-}" ]; then AUTH_ARGS=(-H "Authorization: Bearer ${NTFY_TOKEN}"); fi
          jq -n \
            --arg topic "$TOPIC" \
            --arg title "❌ Overnight research failed" \
            --arg message "The paper-only overnight research workflow failed. Inspect the run: $RUN_URL" \
            '{topic: $topic, title: $title, message: $message, priority: 5, tags: ["warning"]}' \
          | curl --fail -sS -X POST "$SERVER" \
              -H "Content-Type: application/json" \
              "${AUTH_ARGS[@]}" \
              -d @-
