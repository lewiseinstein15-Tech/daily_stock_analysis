# JEXI Market — opportunity-driven watcher on GitHub Actions.
#
# JEXI watches the market for GOOD MOMENTS (breakouts, momentum bursts,
# oversold bounces, squeezes, gaps) and only wakes the full analysis
# pipeline when one fires — then it pushes PLAIN-ENGLISH notifications
# straight into the user's Jexi app Notifications feed.
#
# Setup (repo Settings -> Secrets and variables -> Actions):
#   JEXI_AGENT_SECRET   the shared agent secret of your Jexi server
#   JEXI_APP_EMAIL      the Jexi account email to trade for
#   (broker + AI keys are NOT stored here — the user saves them in the
#    Jexi app under Settings -> Keys, and the watcher pulls them at start)
#   Optional knobs (all have safe defaults):
#     JEXI_SCANNER_UNIVERSE  comma-separated symbols to watch
#     JEXI_MIN_CONFIDENCE    trade only when this sure (0..1)
#
# NOTE: GitHub Actions cron is UTC and can drift by several minutes.
# The watcher itself is market-hours aware and safe to run more often
# than needed (cooldowns prevent repeat firing).

name: jexi-watch

on:
  schedule:
    # US equity session weekdays 13:30-20:00 UTC = 9:30-16:00 ET.
    - cron: "*/15 13-19 * * 1-5"
  workflow_dispatch: {}   # manual runs from the Actions tab

concurrency:
  group: jexi-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The Jexi app is the single home: the watcher pulls the user's saved
      # broker/AI keys from their account at start, follows the paper/live
      # switch made in the app, and pushes every plain-English report into
      # the app's Notifications feed. No broker keys, no ntfy, in GitHub.
      JEXI_APP_SERVER: ${{ vars.JEXI_APP_SERVER || 'https://jexi-server.vercel.app' }}
      JEXI_AGENT_SECRET: ${{ secrets.JEXI_AGENT_SECRET }}
      JEXI_APP_EMAIL: ${{ secrets.JEXI_APP_EMAIL }}
      JEXI_SCANNER_UNIVERSE: ${{ secrets.JEXI_SCANNER_UNIVERSE || 'AAPL,MSFT,NVDA,GOOGL,AMZN,META,TSLA,SPY,QQQ' }}
      JEXI_MIN_CONFIDENCE: ${{ secrets.JEXI_MIN_CONFIDENCE || '0.55' }}
      JEXI_WATCH_INTERVAL: "120"
      JEXI_PLAIN_ENGLISH: "1"
      JEXI_NOTIFY_TRIGGERS: "1"
      JEXI_NOTIFY_DAILY_PLAN: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run one opportunity watch (trigger -> analyze -> trade -> notify)
        run: |
          python -m jexi_market watch --once --no-telegram
