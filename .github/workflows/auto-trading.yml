name:  Automated Trading Bot

on:
  schedule:
    # Run every 2 hours during market hours (Mon-Fri, UTC).
    # NOTE (v0.3): UTC->ET offset drifts with DST — these crons are 9:30 ET
    # during EST and 10:30 ET during EDT (and 20:00 UTC is 15:00/16:00 ET).
    # The bot double-checks the Alpaca clock before trading, so off-by-one
    # hour during EDT only wastes a cycle. For exact ET scheduling, migrate
    # to the 24/7 runner: `python -m jexi_market.cli run247`.
    # 9:30 AM ET (Market Open, EST)
    - cron: '30 14 * * 1-5'
    # 11:30 AM ET (EST)
    - cron: '30 16 * * 1-5'
    # 1:30 PM ET (EST)
    - cron: '30 18 * * 1-5'
    # 3:00 PM ET (EST, before market close)
    - cron: '00 20 * * 1-5'

  # Manual trigger
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even when the US market is closed'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run (plan + report only, never submit orders)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  trading-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requests/pytz: bot core. pandas/numpy/python-dotenv/pydantic/
          # tenacity/fake_useragent: allow the bot's ResearchAgent to import
          # the repo's own analysis engine (src.stock_analyzer). Without them
          # it degrades gracefully to the built-in technical scorer.
          pip install requests pytz pandas numpy python-dotenv pydantic tenacity fake_useragent

      - name: Run Trading Bot
        env:
          # Everything the bot needs comes from the user's Jexi account:
          # broker keys, AI keys, paper/live mode. GitHub stores nothing but
          # a door key (JEXI_AGENT_SECRET) and the account email.
          JEXI_APP_SERVER: ${{ vars.JEXI_APP_SERVER || 'https://jexi-server.vercel.app' }}
          JEXI_AGENT_SECRET: ${{ secrets.JEXI_AGENT_SECRET }}
          JEXI_APP_EMAIL: ${{ secrets.JEXI_APP_EMAIL }}
          STOCKS_TO_TRADE: ${{ vars.STOCKS_TO_TRADE || 'AAPL,MSFT,NVDA' }}
          BOT_PAPER_ONLY: ${{ vars.BOT_PAPER_ONLY || 'true' }}
          BOT_ALLOW_LIVE_TRADING: ${{ vars.BOT_ALLOW_LIVE_TRADING || 'false' }}
          BOT_USE_LLM_AGENTS: ${{ vars.BOT_USE_LLM_AGENTS || 'false' }}
          BOT_LLM_AGENTS_REQUIRED: ${{ vars.BOT_LLM_AGENTS_REQUIRED || 'false' }}
          BOT_LLM_AGENT_WEIGHT: ${{ vars.BOT_LLM_AGENT_WEIGHT || '0.35' }}
          AGENT_ARCH: ${{ vars.AGENT_ARCH || 'multi' }}
          AGENT_ORCHESTRATOR_MODE: ${{ vars.AGENT_ORCHESTRATOR_MODE || 'standard' }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL }}
          BOT_FORCE_RUN: ${{ inputs.force }}
          BOT_DRY_RUN: ${{ inputs.dry_run }}
        run: python automated_trading_bot.py

      - name: Notify Jexi app if failed
        if: failure()
        env:
          JEXI_APP_SERVER: ${{ vars.JEXI_APP_SERVER || 'https://jexi-server.vercel.app' }}
          JEXI_AGENT_SECRET: ${{ secrets.JEXI_AGENT_SECRET }}
          JEXI_APP_EMAIL: ${{ secrets.JEXI_APP_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${JEXI_AGENT_SECRET:-}" ] || [ -z "${JEXI_APP_EMAIL:-}" ]; then
            echo "Jexi app not configured (set JEXI_AGENT_SECRET / JEXI_APP_EMAIL secrets)."
            exit 0
          fi
          curl --fail -sS -X POST "${JEXI_APP_SERVER%/}/api/agent/notify" \
            -H "x-agent-secret: ${JEXI_AGENT_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${JEXI_APP_EMAIL}\",\"kind\":\"warn\",\"title\":\"Trading run failed\",\"message\":\"One of Jexi's trading runs did not finish this cycle. Your money and positions are safe - the next run picks up automatically.\"}" \
            && echo "failure notice delivered to the Jexi app"
