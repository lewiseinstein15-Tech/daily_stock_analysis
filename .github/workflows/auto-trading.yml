# Automated Trading Bot — runs the JEXI Market runner (any broker).
#
# This used to drive the legacy Alpaca-only bot, which failed hard the
# moment the user saved non-Alpaca broker keys (e.g. Pocket Option) in
# the Jexi app. It now runs the same broker-agnostic watcher as
# jexi-watch: keys + paper/live mode are pulled from the user's Jexi
# account at start, every report lands in the app's Notifications feed.
#
# Setup (repo Settings -> Secrets and variables -> Actions):
#   JEXI_AGENT_SECRET   the shared agent secret of your Jexi server
#   JEXI_APP_EMAIL      the Jexi account email to trade for
#
# NOTE: GitHub Actions cron is UTC and drifts with DST. The watcher is
# market-hours aware; off-by-one-hour only wastes a cycle.

name: Automated Trading Bot

on:
  schedule:
    # US equity session checkpoints (weekdays, UTC).
    - cron: '30 14 * * 1-5'   # 9:30 AM ET (EST)
    - cron: '30 16 * * 1-5'   # 11:30 AM ET (EST)
    - cron: '30 18 * * 1-5'   # 1:30 PM ET (EST)
    - cron: '00 20 * * 1-5'   # 3:00 PM ET (EST)
  workflow_dispatch: {}       # manual runs from the Actions tab

permissions:
  contents: read

concurrency:
  group: auto-trading
  cancel-in-progress: false

jobs:
  trading-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Everything the runner needs comes from the user's Jexi account:
      # broker keys (Alpaca / Binance / Pocket Option), AI keys, and the
      # paper/live switch. GitHub stores nothing but a door key.
      JEXI_APP_SERVER: ${{ vars.JEXI_APP_SERVER || 'https://jexi-server.vercel.app' }}
      JEXI_AGENT_SECRET: ${{ secrets.JEXI_AGENT_SECRET }}
      JEXI_APP_EMAIL: ${{ secrets.JEXI_APP_EMAIL }}
      JEXI_SCANNER_UNIVERSE: ${{ secrets.JEXI_SCANNER_UNIVERSE || vars.STOCKS_TO_TRADE || 'AAPL,MSFT,NVDA,GOOGL,AMZN,META,TSLA,SPY,QQQ' }}
      JEXI_MIN_CONFIDENCE: ${{ secrets.JEXI_MIN_CONFIDENCE || '0.55' }}
      JEXI_WATCH_INTERVAL: "120"
      JEXI_PLAIN_ENGLISH: "1"
      JEXI_NOTIFY_TRIGGERS: "1"
      JEXI_NOTIFY_DAILY_PLAN: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run one full trading cycle (any broker, app decides paper/live)
        run: |
          python -m jexi_market watch --once --no-telegram

      - name: Notify Jexi app if failed
        if: failure()
        env:
          JEXI_APP_SERVER: ${{ vars.JEXI_APP_SERVER || 'https://jexi-server.vercel.app' }}
          JEXI_AGENT_SECRET: ${{ secrets.JEXI_AGENT_SECRET }}
          JEXI_APP_EMAIL: ${{ secrets.JEXI_APP_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${JEXI_AGENT_SECRET:-}" ] || [ -z "${JEXI_APP_EMAIL:-}" ]; then
            echo "Jexi app not configured (set JEXI_AGENT_SECRET / JEXI_APP_EMAIL secrets)."
            exit 0
          fi
          curl --fail -sS -X POST "${JEXI_APP_SERVER%/}/api/agent/notify" \
            -H "x-agent-secret: ${JEXI_AGENT_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${JEXI_APP_EMAIL}\",\"kind\":\"warn\",\"title\":\"Trading run failed\",\"message\":\"One of Jexi's trading runs did not finish this cycle. Your money and positions are safe - the next run picks up automatically.\"}" \
            && echo "failure notice delivered to the Jexi app"
