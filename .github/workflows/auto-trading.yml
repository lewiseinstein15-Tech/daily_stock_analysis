name:  Automated Trading Bot

on:
  schedule:
    # Run every 2 hours during market hours (Mon-Fri, UTC).
    # NOTE (v0.3): UTC->ET offset drifts with DST — these crons are 9:30 ET
    # during EST and 10:30 ET during EDT (and 20:00 UTC is 15:00/16:00 ET).
    # The bot double-checks the Alpaca clock before trading, so off-by-one
    # hour during EDT only wastes a cycle. For exact ET scheduling, migrate
    # to the 24/7 runner: `python -m jexi_market.cli run247`.
    # 9:30 AM ET (Market Open, EST)
    - cron: '30 14 * * 1-5'
    # 11:30 AM ET (EST)
    - cron: '30 16 * * 1-5'
    # 1:30 PM ET (EST)
    - cron: '30 18 * * 1-5'
    # 3:00 PM ET (EST, before market close)
    - cron: '00 20 * * 1-5'

  # Manual trigger
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even when the US market is closed'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run (plan + report only, never submit orders)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  trading-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requests/pytz: bot core. pandas/numpy/python-dotenv/pydantic/
          # tenacity/fake_useragent: allow the bot's ResearchAgent to import
          # the repo's own analysis engine (src.stock_analyzer). Without them
          # it degrades gracefully to the built-in technical scorer.
          pip install requests pytz pandas numpy python-dotenv pydantic tenacity fake_useragent

      - name: Run Trading Bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          APCA_API_BASE_URL: ${{ vars.APCA_API_BASE_URL || 'https://paper-api.alpaca.markets' }}
          ALPACA_DATA_BASE_URL: ${{ vars.ALPACA_DATA_BASE_URL || 'https://data.alpaca.markets' }}
          # NTFY_URL is the canonical full endpoint; the bot also accepts the
          # legacy NTFY_SERVER/NTFY_TOPIC pair for existing configurations.
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'my-stock-report-kenya' }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          STOCKS_TO_TRADE: ${{ vars.STOCKS_TO_TRADE || 'AAPL,MSFT,NVDA' }}
          BOT_PAPER_ONLY: ${{ vars.BOT_PAPER_ONLY || 'true' }}
          BOT_ALLOW_LIVE_TRADING: ${{ vars.BOT_ALLOW_LIVE_TRADING || 'false' }}
          BOT_USE_LLM_AGENTS: ${{ vars.BOT_USE_LLM_AGENTS || 'false' }}
          BOT_LLM_AGENTS_REQUIRED: ${{ vars.BOT_LLM_AGENTS_REQUIRED || 'false' }}
          BOT_LLM_AGENT_WEIGHT: ${{ vars.BOT_LLM_AGENT_WEIGHT || '0.35' }}
          AGENT_ARCH: ${{ vars.AGENT_ARCH || 'multi' }}
          AGENT_ORCHESTRATOR_MODE: ${{ vars.AGENT_ORCHESTRATOR_MODE || 'standard' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL }}
          BOT_FORCE_RUN: ${{ inputs.force }}
          BOT_DRY_RUN: ${{ inputs.dry_run }}
        run: python automated_trading_bot.py

      - name: Notify if failed (ntfy JSON publish API)
        if: failure()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'my-stock-report-kenya' }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Prefer NTFY_URL secret (https://server/topic); fall back to
          # NTFY_SERVER + NTFY_TOPIC variables used by the bot itself.
          if [ -n "${NTFY_URL:-}" ]; then
            TOPIC="${NTFY_URL##*/}"
            SERVER="${NTFY_URL%/*}"
          else
            TOPIC="${NTFY_TOPIC:-}"
            SERVER="${NTFY_SERVER:-}"
          fi
          if [ -z "${TOPIC:-}" ] || [ -z "${SERVER:-}" ] || [ "$SERVER" = "${NTFY_URL:-}" ]; then
            echo "No usable ntfy destination configured (set NTFY_URL secret or NTFY_TOPIC/NTFY_SERVER vars)."
            exit 0
          fi
          AUTH_ARGS=()
          if [ -n "${NTFY_TOKEN:-}" ]; then AUTH_ARGS=(-H "Authorization: Bearer ${NTFY_TOKEN}"); fi
          jq -n \
            --arg topic "$TOPIC" \
            --arg title "❌ Trading bot run failed" \
            --arg message "The automated trading bot workflow failed. The bot may not have sent its cycle report. Open the run log: $RUN_URL" \
            '{topic: $topic, title: $title, message: $message, priority: 5, tags: ["warning"]}' \
          | curl --fail -sS -X POST "$SERVER" \
              -H "Content-Type: application/json" \
              "${AUTH_ARGS[@]}" \
              -d @-
