name:  Automated Trading Bot

on:
  schedule:
    # Run every 2 hours during market hours (Mon-Fri)
    # 9:30 AM ET (Market Open)
    - cron: '30 14 * * 1-5'
    # 11:30 AM ET
    - cron: '30 16 * * 1-5'
    # 1:30 PM ET
    - cron: '30 18 * * 1-5'
    # 3:00 PM ET (Before market close)
    - cron: '00 20 * * 1-5'
  
  # Manual trigger
  workflow_dispatch:

jobs:
  trading-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz
      
      - name: Run Trading Bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python automated_trading_bot.py
      
      - name: Notify if failed
        if: failure()
        run: |
          curl -d "title=Bot Failed&message=GitHub Actions failed" ${{ secrets.NTFY_URL }}
